# Checks every push and pull request. Pushes to main deploy what they touch to Cloud Run:
#   app/, ui/, deploy/          -> the app (luna-demo)
#   agent-server/               -> Luna's and Guido's agent server (luna-agent, Mastra)
#   agent-server-aisdk/         -> the second harness (luna-agent-aisdk, AI SDK 7)
#   embed-server/               -> the embedding service (tib-embed)
# A manual run (Actions > check and deploy > Run workflow) deploys the part chosen there.
# No keys in GitHub: Actions signs in to Google Cloud through Workload Identity Federation, and only this
# repository may do that. App secrets stay in Secret Manager; the service keeps its references to them.
# Settings are repository variables (Settings > Secrets and variables > Actions > Variables).
name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      what:
        description: what to deploy
        type: choice
        options: [app, agents, embed, all]
        default: app

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install pyflakes
      - run: python -m pyflakes app deploy pipeline tavus
      - run: for f in app/static/js/*.js; do node --check "$f"; done
      - run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build  # types and the island build

  deploy:
    needs: check
    if: github.repository == 'SDM-TIB/DigiStrucMed-Agents' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write  # for the Workload Identity Federation token
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.what || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            app:
              - 'app/**'
              - 'deploy/**'
              - 'ui/**'
            agent:
              - 'agent-server/**'
            aisdk:
              - 'agent-server-aisdk/**'
            embed:
              - 'embed-server/**'
      - id: plan  # what this run deploys
        run: |
          any() { for x in "$@"; do [ "$x" = true ] && return 0; done; return 1; }
          m="$MANUAL"
          app=false; agent=false; aisdk=false; embed=false
          if [ -n "$m" ]; then
            case "$m" in app) app=true;; agents) agent=true; aisdk=true;; embed) embed=true;; all) app=true; agent=true; aisdk=true; embed=true;; esac
          else
            app=${{ steps.changed.outputs.app }}; agent=${{ steps.changed.outputs.agent }}
            aisdk=${{ steps.changed.outputs.aisdk }}; embed=${{ steps.changed.outputs.embed }}
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "aisdk=$aisdk" >> "$GITHUB_OUTPUT"; echo "embed=$embed" >> "$GITHUB_OUTPUT"
          if any $app $agent $aisdk $embed; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "deploy: app=$app agent=$agent agent-aisdk=$aisdk embed=$embed"
      - if: steps.plan.outputs.any == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - if: steps.plan.outputs.any == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - if: steps.plan.outputs.app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - if: steps.plan.outputs.embed == 'true'
        run: python deploy/deploy.py embed --code-only
      - if: steps.plan.outputs.agent == 'true'
        run: python deploy/deploy.py agent --code-only
        env:
          LUNA_MODEL: ${{ vars.LUNA_MODEL }}
      - if: steps.plan.outputs.aisdk == 'true'
        run: python deploy/deploy.py agent-aisdk --code-only
        env:
          LUNA_MODEL: ${{ vars.LUNA_MODEL }}
      - if: steps.plan.outputs.app == 'true'
        run: python deploy/deploy.py app --code-only
        env:
          PAGE_BUCKET: ${{ vars.PAGE_BUCKET }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
          MAX_CALL_SECONDS: ${{ vars.MAX_CALL_SECONDS }}
          GRAPH_ENDPOINT: ${{ vars.GRAPH_ENDPOINT }}
          EMBED_URL: ${{ vars.EMBED_URL }}
          AGENT_URL: ${{ vars.AGENT_URL }}
          AGENT_AISDK_URL: ${{ vars.AGENT_AISDK_URL }}
          LUNA_IMAGE_TOOL: ${{ vars.LUNA_IMAGE_TOOL }}
          GUIDO_HARNESS: ${{ vars.GUIDO_HARNESS }}
